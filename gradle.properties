# Gradle properties
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xms3g -Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true

# Application properties
android.useAndroidX=true
# Disable baseline profile generation for F-Droid reproducible builds
android.enableProfileInstaller=false
systemProp.android.enableProfileInstaller=false
kotlin.code.style=official

# Screenshot goldens (#67): plain `testDebugUnitTest` (the gate) verifies the committed goldens under each feature
# module's src/test/screenshots, so a visual change fails until someone runs `recordRoborazziDebug` on purpose.
roborazzi.test.verify=true

# Release signing configuration (use environment variables)
# Set these environment variables for signed builds:
# ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=../splatman-release.keystore
# ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=your_password
# ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=splatman
# ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=your_password

# Maven Central 429 cushion (#430, until the read-only cache of ADR 0017 is in the image): Gradle 8.11.1's
# NetworkOperationBackOffAndRetry retries 408/429/5xx, doubling the wait each time. Defaults are 3 attempts from
# 1000 ms; 6 attempts from 2000 ms waits 2+4+8+16+32 s (about a minute) before the gate gives up.
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
